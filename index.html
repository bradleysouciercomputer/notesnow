<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafd">
  <meta name="description" content="A simple place to create and keep your notes.">
  <title>NotesNow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">

  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>

  <style>
    :root {
      color-scheme: light;
      --md-sys-color-primary: #0b57d0;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d3e3fd;
      --md-sys-color-on-primary-container: #041e49;
      --md-sys-color-secondary: #535f70;
      --md-sys-color-on-secondary: #ffffff;
      --md-sys-color-secondary-container: #dbe2f9;
      --md-sys-color-on-secondary-container: #3e4758;
      --md-sys-color-error: #ba1a1a;
      --md-sys-color-on-error: #ffffff;
      --md-sys-color-surface: #f8fafd;
      --md-sys-color-on-surface: #191c20;
      --md-sys-color-surface-variant: #e1e5ed;
      --md-sys-color-on-surface-variant: #44474f;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-low: #f4f7fc;
      --md-sys-color-surface-container: #eef2f8;
      --md-sys-color-surface-container-high: #e8edf5;
      --md-sys-color-outline: #74777f;
      --md-sys-color-outline-variant: #c4c7d0;

      --md-sys-shape-corner-small: 8px;
      --md-sys-shape-corner-medium: 12px;
      --md-sys-shape-corner-large: 16px;
      --md-sys-shape-corner-extra-large: 28px;
      --md-sys-shape-corner-full: 9999px;

      --md-ref-typeface-brand: "Roboto";
      --md-ref-typeface-plain: "Roboto";
      --md-fab-container-shape: var(--md-sys-shape-corner-large);
      --md-filled-button-container-shape: var(--md-sys-shape-corner-full);
      --md-text-button-container-shape: var(--md-sys-shape-corner-full);
      --md-outlined-text-field-container-shape: var(--md-sys-shape-corner-large);
      --md-dialog-container-shape: var(--md-sys-shape-corner-extra-large);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --md-sys-color-primary: #a8c7fa;
      --md-sys-color-on-primary: #062e6f;
      --md-sys-color-primary-container: #0842a0;
      --md-sys-color-on-primary-container: #d3e3fd;
      --md-sys-color-secondary: #c0c7d5;
      --md-sys-color-on-secondary: #293140;
      --md-sys-color-secondary-container: #3e4758;
      --md-sys-color-on-secondary-container: #dbe2f9;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-on-error: #690005;
      --md-sys-color-surface: #101418;
      --md-sys-color-on-surface: #e1e2e8;
      --md-sys-color-surface-variant: #44474f;
      --md-sys-color-on-surface-variant: #c4c7d0;
      --md-sys-color-surface-container-lowest: #0b0f14;
      --md-sys-color-surface-container-low: #191d23;
      --md-sys-color-surface-container: #1d2229;
      --md-sys-color-surface-container-high: #282d35;
      --md-sys-color-outline: #8e9199;
      --md-sys-color-outline-variant: #44474f;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-family: "Roboto", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body { min-height: 100vh; }

    md-icon {
      font-family: "Material Symbols Outlined";
      font-weight: 400;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-flex;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      font-feature-settings: "liga";
      -webkit-font-feature-settings: "liga";
      -webkit-font-smoothing: antialiased;
    }

    .app-bar {
      height: 72px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 clamp(20px, 5vw, 64px);
      background: var(--md-sys-color-surface);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      flex: 0 0 auto;
    }

    .brand-icon md-icon { font-size: 23px; }
    .brand-name { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -.35px; }

    .app-bar-actions {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .theme-toggle {
      --md-icon-button-icon-color: var(--md-sys-color-on-surface-variant);
    }

    .new-note-fab {
      --md-fab-container-height: 48px;
      --md-fab-container-shape: var(--md-sys-shape-corner-large);
    }

    main {
      width: min(100% - 40px, 900px);
      margin: 0 auto;
      padding: 54px 0 96px;
    }

    .page-heading { margin: 0 0 27px; }
    .page-heading h1 {
      margin: 0;
      color: var(--md-sys-color-on-surface);
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 400;
      line-height: 1.22;
      letter-spacing: -.7px;
    }

    .notes-list {
      width: 100%;
      padding: 8px;
      border-radius: var(--md-sys-shape-corner-extra-large);
      background: var(--md-sys-color-surface-container-low);
      overflow: hidden;
    }

    .notes-list md-list-item {
      --md-list-item-label-text-font: "Roboto";
      --md-list-item-supporting-text-font: "Roboto";
      --md-list-item-label-text-size: 16px;
      --md-list-item-label-text-weight: 500;
      --md-list-item-supporting-text-size: 14px;
      --md-list-item-supporting-text-color: var(--md-sys-color-on-surface-variant);
      --md-list-item-one-line-container-height: 64px;
      --md-list-item-two-line-container-height: 80px;
      --md-list-item-container-shape: var(--md-sys-shape-corner-large);
    }

    .notes-list md-divider {
      display: block;
      box-sizing: border-box;
      width: calc(100% + 16px);
      margin: 4px 0 4px -8px;
      --md-divider-color: var(--md-sys-color-outline-variant);
    }

    .notes-list md-icon-button {
      --md-icon-button-icon-color: var(--md-sys-color-on-surface-variant);
    }

    .notes-list md-icon-button:hover {
      --md-icon-button-icon-color: var(--md-sys-color-error);
    }

    .empty-state {
      min-height: 310px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 35px 22px;
      border-radius: var(--md-sys-shape-corner-extra-large);
      background: var(--md-sys-color-surface-container-low);
      text-align: center;
    }

    .empty-icon {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin-bottom: 19px;
      border-radius: 26px;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .empty-icon { overflow: visible; }

    .empty-icon md-icon {
      display: inline-flex;
      width: 1.3em;
      min-width: 1.3em;
      height: 1.3em;
      align-items: center;
      justify-content: center;
      overflow: visible;
      flex: 0 0 auto;
      font-size: 34px;
    }
    .empty-state h2 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -.2px; }
    .empty-state p {
      max-width: 330px;
      margin: 9px 0 20px;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 14px;
      line-height: 1.55;
    }

    .empty-state md-filled-button {
      --md-filled-button-container-height: 44px;
      --md-filled-button-container-shape: var(--md-sys-shape-corner-full);
    }

    .note-dialog {
      width: min(650px, calc(100vw - 28px));
      max-width: 650px;
      --md-dialog-container-color: var(--md-sys-color-surface-container-low);
      --md-dialog-container-shape: var(--md-sys-shape-corner-extra-large);
    }

    .note-dialog::part(dialog) { max-height: min(90vh, 820px); }

    .dialog-headline {
      width: 100%;
      color: var(--md-sys-color-on-surface);
      font-size: 24px;
      line-height: 32px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .editor-fields {
      display: grid;
      gap: 16px;
      min-width: min(510px, calc(100vw - 88px));
      padding-top: 5px;
    }

    .title-field {
      width: 100%;
      --md-outlined-text-field-container-shape: var(--md-sys-shape-corner-large);
      --md-outlined-text-field-container-height: 58px;
      --md-outlined-text-field-input-text-size: 17px;
    }

    .body-field {
      width: 100%;
      --md-outlined-text-field-container-shape: var(--md-sys-shape-corner-large);
      --md-outlined-text-field-input-text-size: 15px;
    }

    .body-field::part(text-field) { min-height: 270px; }

    .note-dialog [slot="actions"],
    .delete-dialog [slot="actions"] { padding: 0 24px 22px; }

    .delete-dialog {
      width: min(420px, calc(100vw - 28px));
      max-width: 420px;
      --md-dialog-container-color: var(--md-sys-color-surface-container-low);
      --md-dialog-container-shape: var(--md-sys-shape-corner-extra-large);
    }

    .delete-message {
      margin: 0;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 14px;
      line-height: 1.55;
    }

    .delete-dialog md-filled-button {
      --md-filled-button-container-height: 40px;
      --md-filled-button-container-shape: var(--md-sys-shape-corner-full);
      --md-filled-button-container-color: var(--md-sys-color-error);
      --md-filled-button-label-text-color: var(--md-sys-color-on-error);
    }

    .delete-dialog md-text-button {
      --md-text-button-container-shape: var(--md-sys-shape-corner-full);
    }
    .note-dialog md-filled-button {
      --md-filled-button-container-height: 40px;
      --md-filled-button-container-shape: var(--md-sys-shape-corner-full);
    }
    .note-dialog md-text-button {
      --md-text-button-container-shape: var(--md-sys-shape-corner-full);
    }

    .snackbar {
      position: fixed;
      z-index: 5;
      left: 50%;
      bottom: 24px;
      max-width: min(460px, calc(100vw - 32px));
      padding: 14px 22px;
      border-radius: var(--md-sys-shape-corner-large);
      background: #30343c;
      color: #f5f5f8;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .2);
      font-size: 14px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 16px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .snackbar.show { opacity: 1; transform: translate(-50%, 0); }

    html[data-theme="dark"] .snackbar {
      background: #e1e2e8;
      color: #30343c;
    }

    @media (max-width: 600px) {
      .app-bar { height: 64px; padding: 0 17px; }
      main { width: calc(100% - 32px); padding-top: 36px; }
      .page-heading { margin-bottom: 20px; }
      .new-note-fab { --md-fab-container-height: 44px; }
      .editor-fields { min-width: 0; }
      .body-field::part(text-field) { min-height: 220px; }
      .note-dialog [slot="actions"],
      .delete-dialog [slot="actions"] { padding: 0 14px 15px; }
      .snackbar { bottom: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>

<body>
  <header class="app-bar">
    <div class="brand">
      <span class="brand-icon"><md-icon>sticky_note_2</md-icon></span>
      <span class="brand-name">NotesNow</span>
    </div>
    <div class="app-bar-actions">
      <md-icon-button class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode" title="Switch to dark mode">
        <md-icon id="themeIcon">dark_mode</md-icon>
      </md-icon-button>
      <md-fab class="new-note-fab" label="New note" variant="primary" id="newNoteButton" aria-label="Create a new note">
        <md-icon slot="icon">add</md-icon>
      </md-fab>
    </div>
  </header>

  <main>
    <section class="page-heading">
      <h1 class="md-typescale-headline-large">Your notes</h1>
    </section>
    <section id="notesArea" aria-label="Your notes">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon"><md-icon>edit_note</md-icon></div>
        <h2>No notes yet</h2>
        <p>Create your first note to get started.</p>
        <md-filled-button id="emptyNewNoteButton" has-icon>
          <md-icon slot="icon">add</md-icon>
          Create a note
        </md-filled-button>
      </div>
      <md-list class="notes-list" id="notesList" aria-label="Saved notes" hidden></md-list>
    </section>
  </main>

  <md-dialog class="note-dialog" id="noteDialog">
    <div slot="headline" class="dialog-headline" id="dialogTitle">New note</div>
    <div slot="content" class="editor-fields">
      <md-outlined-text-field class="title-field" id="noteTitle" label="Title" maxlength="160"></md-outlined-text-field>
      <md-outlined-text-field class="body-field" id="noteContent" label="Write your note..." type="textarea" rows="10"></md-outlined-text-field>
    </div>
    <div slot="actions">
      <md-text-button id="cancelButton">Cancel</md-text-button>
      <md-filled-button id="saveButton">Save note</md-filled-button>
    </div>
  </md-dialog>

  <md-dialog class="delete-dialog" id="deleteDialog" aria-labelledby="deleteDialogTitle">
    <div slot="headline" class="dialog-headline" id="deleteDialogTitle">Delete note?</div>
    <div slot="content">
      <p class="delete-message" id="deleteDialogMessage">This note will be permanently deleted. This action can't be undone.</p>
    </div>
    <div slot="actions">
      <md-text-button id="cancelDeleteButton">Cancel</md-text-button>
      <md-filled-button id="confirmDeleteButton">Delete</md-filled-button>
    </div>
  </md-dialog>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>

  <script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';

    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);

    const STORAGE_KEY = 'notesnow-notes-v1';
    const THEME_KEY = 'notesnow-theme-v1';
    const $ = (id) => document.getElementById(id);
    const createId = () => crypto.randomUUID ? crypto.randomUUID() : 'note-' + Date.now() + '-' + Math.random().toString(36).slice(2);

    function applyTheme(theme, persist = true) {
      const isDark = theme === 'dark';
      document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      $('themeIcon').textContent = isDark ? 'light_mode' : 'dark_mode';
      $('themeToggle').setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      $('themeToggle').setAttribute('title', isDark ? 'Switch to light mode' : 'Switch to dark mode');

      const themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) themeColor.content = isDark ? '#101418' : '#f8fafd';

      if (persist) {
        try {
          localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
        } catch (error) {
          console.warn('Could not save theme preference:', error);
        }
      }
    }

    let savedTheme = 'light';
    try {
      savedTheme = localStorage.getItem(THEME_KEY) || 'light';
    } catch (error) {
      console.warn('Could not read theme preference:', error);
    }
    applyTheme(savedTheme, false);

    let notes = loadNotes();
    let editingId = null;
    let pendingDeleteId = null;
    let toastTimeout = null;

    function loadNotes() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (!Array.isArray(stored)) return [];
        return stored
          .filter((note) => note && typeof note === 'object')
          .map((note) => ({
            id: String(note.id || createId()),
            title: String(note.title || ''),
            content: String(note.content || '')
          }));
      } catch (error) {
        console.error('Could not load notes:', error);
        return [];
      }
    }

    function saveNotes() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
        return true;
      } catch (error) {
        console.error('Could not save notes:', error);
        showMessage('Could not save this note in browser storage.');
        return false;
      }
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function showMessage(message) {
      const snackbar = $('snackbar');
      snackbar.textContent = message;
      snackbar.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => snackbar.classList.remove('show'), 2400);
    }

    function notePreview(content) {
      return content.replace(/\s+/g, ' ').trim();
    }

    function renderNotes() {
      const empty = notes.length === 0;
      $('emptyState').hidden = !empty;
      $('notesList').hidden = empty;

      if (empty) {
        $('notesList').replaceChildren();
        return;
      }

      const markup = notes.map((note) => {
        const title = escapeHTML(note.title || 'Untitled note');
        const preview = escapeHTML(notePreview(note.content));
        return '<md-list-item type="button" data-note-id="' + escapeHTML(note.id) + '">' +
          '<div slot="headline">' + title + '</div>' +
          (preview ? '<div slot="supporting-text">' + preview + '</div>' : '') +
          '<md-icon-button slot="end" data-delete-id="' + escapeHTML(note.id) + '" aria-label="Delete ' + title + '" title="Delete note"><md-icon>delete</md-icon></md-icon-button>' +
          '</md-list-item>';
      }).join('<md-divider></md-divider>');

      $('notesList').innerHTML = markup;
    }

    function openEditor(id = null) {
      const note = id ? notes.find((item) => item.id === id) : null;
      editingId = note ? note.id : null;
      $('dialogTitle').textContent = note ? 'Edit note' : 'New note';
      $('saveButton').textContent = note ? 'Save changes' : 'Save note';
      $('noteTitle').value = note ? note.title : '';
      $('noteContent').value = note ? note.content : '';
      $('noteDialog').open = true;
      requestAnimationFrame(() => $('noteTitle').focus());
    }

    function saveCurrentNote() {
      const title = $('noteTitle').value.trim();
      const content = $('noteContent').value.trim();

      if (!title && !content) {
        showMessage('Write something before saving your note.');
        $('noteTitle').focus();
        return;
      }

      if (editingId) {
        const note = notes.find((item) => item.id === editingId);
        if (note) {
          note.title = title;
          note.content = $('noteContent').value;
        }
      } else {
        notes.unshift({
          id: createId(),
          title,
          content: $('noteContent').value
        });
      }

      if (!saveNotes()) return;

      $('noteDialog').open = false;
      editingId = null;
      renderNotes();
      showMessage('Note saved');
    }

    $('themeToggle').addEventListener('click', () => {
      const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
    });

    $('newNoteButton').addEventListener('click', () => openEditor());
    $('emptyNewNoteButton').addEventListener('click', () => openEditor());
    $('saveButton').addEventListener('click', saveCurrentNote);
    $('cancelButton').addEventListener('click', () => {
      $('noteDialog').open = false;
      editingId = null;
    });

    $('notesList').addEventListener('click', (event) => {
      const deleteButton = event.composedPath().find((node) =>
        node instanceof HTMLElement && node.matches('md-icon-button[data-delete-id]')
      );

      if (deleteButton) {
        event.preventDefault();
        event.stopPropagation();

        const id = deleteButton.dataset.deleteId;
        const note = notes.find((item) => item.id === id);
        if (!note) return;

        pendingDeleteId = id;
        const noteName = note.title.trim() || 'Untitled note';
        $('deleteDialogMessage').textContent =
          '"' + noteName + '" will be permanently deleted. This action cannot be undone.';
        $('deleteDialog').open = true;
        return;
      }

      const item = event.target.closest('md-list-item[data-note-id]');
      if (item) openEditor(item.dataset.noteId);
    });

    function deletePendingNote() {
      if (!pendingDeleteId) return;

      const id = pendingDeleteId;
      const note = notes.find((item) => item.id === id);
      if (!note) {
        pendingDeleteId = null;
        $('deleteDialog').open = false;
        return;
      }

      const previousNotes = notes;
      notes = notes.filter((item) => item.id !== id);
      if (!saveNotes()) {
        notes = previousNotes;
        return;
      }

      pendingDeleteId = null;
      $('deleteDialog').open = false;

      if (editingId === id) {
        $('noteDialog').open = false;
        editingId = null;
      }

      renderNotes();
      showMessage('Note deleted');
    }

    $('cancelDeleteButton').addEventListener('click', () => {
      pendingDeleteId = null;
      $('deleteDialog').open = false;
    });

    $('confirmDeleteButton').addEventListener('click', deletePendingNote);

    $('deleteDialog').addEventListener('cancel', () => {
      pendingDeleteId = null;
    });

    $('noteDialog').addEventListener('cancel', () => {
      editingId = null;
    });

    renderNotes();
  </script>
</body>
</html>
